name: RM NeuroAI schema export (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-schema:
    name: Export remote schema without data or migration changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ccfuoqpaxrzwrrdqovrp
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: fix/rm-neuroai-dev-foundation

      - name: Verify required repository secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }

      - name: Install Supabase CLI v3
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Link CLI to the approved project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Export schema only
        run: |
          mkdir -p artifacts
          supabase db dump --schema public,private --file artifacts/rm-neuroai-schema.sql --remote

      - name: Verify export contains no table data statements
        shell: bash
        run: |
          test -s artifacts/rm-neuroai-schema.sql
          if grep -Eiq '^(COPY |INSERT INTO )' artifacts/rm-neuroai-schema.sql; then
            echo "Unexpected data statements found in schema export"
            exit 1
          fi
          sha256sum artifacts/rm-neuroai-schema.sql | tee artifacts/SHA256SUMS
          wc -l artifacts/rm-neuroai-schema.sql | tee artifacts/EXPORT_LINES.txt

      - name: Upload schema export for human review
        uses: actions/upload-artifact@v4
        with:
          name: rm-neuroai-schema-only-export
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
