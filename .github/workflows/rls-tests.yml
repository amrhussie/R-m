name: RM NeuroAI local RLS verification

on:
  pull_request:
    branches:
      - fix/rm-neuroai-dev-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rm-neuroai-rls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-gate:
    name: Check for a reviewed migration baseline
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Require a committed SQL migration before database tests
        shell: bash
        run: |
          if find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "A migration file exists; local RLS tests may run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No baseline migration exists yet. RLS database tests are skipped, not passed."
            {
              echo "## RLS verification"
              echo ""
              echo "**SKIPPED:** no committed SQL migration exists under supabase/migrations/."
              echo "Create and review the baseline migration before relying on behavioral RLS results."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  rls-tests:
    name: Run structural and tenant-isolation tests locally
    needs: migration-gate
    if: needs.migration-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start disposable local Supabase stack
        run: supabase start

      - name: Apply migrations to local database
        run: supabase db reset

      - name: Run pgTAP and structural RLS tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
