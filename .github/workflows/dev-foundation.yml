name: RM NeuroAI development foundation

on:
  push:
    branches:
      - fix/rm-neuroai-dev-foundation
  pull_request:
    branches:
      - fix/rm-neuroai-dev-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rm-neuroai-dev-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen install, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify committed lockfile
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build
