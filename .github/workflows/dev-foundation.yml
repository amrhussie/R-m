name: RM NeuroAI development foundation

on:
  push:
    branches:
      - fix/rm-neuroai-dev-foundation
  pull_request:
    branches:
      - feat/rm-neuroai-supabase-auth
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rm-neuroai-dev-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lockfile, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate candidate Bun lockfile
        run: bun install --lockfile-only

      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-neuroai-bun-lock-candidate
          path: bun.lock
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated lockfile to development branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Bun lockfile"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          else
            echo "bun.lock is already synchronized."
          fi

      - name: Verify reproducible dependency installation
        run: bun install --frozen-lockfile

      - name: TypeScript validation
        run: bun run lint

      - name: Production build
        run: bun run build
